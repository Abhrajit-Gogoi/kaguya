<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaguya - Local AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h2>Personality</h2>
      <div class="field">
        <label for="persona-select">Preset</label>
        <select id="persona-select">
          <option value="helpful">Helpful Assistant</option>
          <option value="coder">Senior Developer</option>
          <option value="concise">Concise Executive</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div class="field">
        <label for="sys-prompt">System Prompt</label>
        <textarea id="sys-prompt" rows="5"></textarea>
      </div>

      <h2>Parameters</h2>
      <div class="field">
        <label for="temp">Temperature: <span id="temp-val">0.7</span></label>
        <input type="range" id="temp" min="0" max="1.2" step="0.1" value="0.7">
      </div>

      <div class="field">
        <label for="top-p">Top-P: <span id="topp-val">0.9</span></label>
        <input type="range" id="top-p" min="0.1" max="1.0" step="0.05" value="0.9">
      </div>

      <button id="clear-btn" class="secondary-btn">Clear Chat</button>
    </aside>

    <main id="main">
      <div id="status">Starting...</div>
      <div id="chat"></div>
      <div id="input-bar">
        <input type="text" id="input" placeholder="Type a message..." />
        <button id="send">Send</button>
      </div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
